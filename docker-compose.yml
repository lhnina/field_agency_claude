services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fieldagency
      POSTGRES_USER: fieldagency
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fieldagency}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldagency"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      FA_DATABASE_URL: postgresql+psycopg://fieldagency:${DB_PASSWORD:-fieldagency}@db:5432/fieldagency
      FA_JWT_SECRET: ${JWT_SECRET:-mude-este-segredo-em-producao-com-32-caracteres}
      FA_CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
